spring:
  application:
    name: Goto
  batch:
    job:
      enabled: false
    jdbc:
      initialize-schema: never
  cloud:
    aws:
      region:
        static: ap-northeast-2
  servlet:
    multipart:
      # ImageStorageProperties.maxFileSizeBytes(10MB)와 맞춘다. 요청 한도를 조금 더 크게 둬야
      # 멀티파트 오버헤드 때문에 서버가 413을 먼저 던지지 않는다.
      max-file-size: 10MB
      max-request-size: 12MB
  datasource:
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

---
spring:
  config:
    activate:
      on-profile: "!test"
    import: 'optional:aws-parameterstore:/goto/'

security:
  jwt:
    issuer: GOTO-BE
    access-token-ttl: 60m
    refresh-token-ttl: 14d

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

tour-api:
  base-url: "https://apis.data.go.kr/B551011/KorService2"
  with-base-url: "https://apis.data.go.kr/B551011/KorWithService2"
  mobile-os: "ETC"
  mobile-app: "Goto"
  detail-quota: 250
  detail-concurrency: 1
  detail-queue-capacity: 250
  detail-await-termination-seconds: 60

# client-id/client-secret은 Parameter Store(/goto/naver-reverse-geocoding.*)에서 주입된다.
# 둘 다 비어있으면 NaverReverseGeocodingClient가 호출 자체를 건너뛰고 Optional.empty()를 반환한다.
naver-reverse-geocoding:
  base-url: "https://naveropenapi.apigw.ntruss.com/map-reversegeocode/v2/gc"

goto:
  # bucket, public-base-url은 Parameter Store(/goto/goto.image-storage.*)에서 주입된다.
  # bucket이 비어 있으면 업로드 API만 503을 돌려주고 나머지 기능은 정상 동작한다.
  # public-base-url(CloudFront 도메인)은 끝 슬래시 없이 넣는다. 비어 있으면
  # S3 기본 URL(https://{bucket}.s3.{region}.amazonaws.com/{key})을 만든다.
  image-storage:
    key-prefix: "obstacle-reports"
  # Firebase 서비스 계정 키는 yaml에 두지 않는다.
  # Parameter Store(/goto/goto.push.credentials)에 base64로 넣거나 goto.push.credentials-path로 파일을 준다.
  # 둘 다 비어 있으면 푸시는 로그만 남기고 나머지 기능은 그대로 동작한다.
  push:
    help-request-radius-meters: 300
    # 1단계는 최근 1시간 안에 위치를 보고한 기기에만 보내고, 5분 안에 수락이 없으면
    # location-freshness(6시간)까지 대상을 넓혀 한 번 더 보낸다.
    immediate-location-freshness: 1h
    escalation-delay: 5m
    location-freshness: 6h
    saved-place-obstacle-radius-meters: 500
    batch-size: 500
    dry-run: false
  batch:
    initial-load:
      auto-run-enabled: true
  cache:
    default-ttl: 24h
    caches:
      help-requests-pending-count:
        name: "help-requests:pending-count"
        ttl: 10s
      indoor-map:
        name: "indoor-map"
        ttl: 24h

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    redis:
      enabled: false
